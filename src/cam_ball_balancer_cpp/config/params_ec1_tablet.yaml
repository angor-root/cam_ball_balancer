# Geometria de la tableta EC1 (convencion REP-103, Y arriba en la imagen)
# Parametros del vision_node C++ (mismos nombres que la version Python).
vision_node:
  ros__parameters:
    device: "0"            # /dev/video0 en la Pi
    width: 640
    height: 480
    fps: 30.0
    fourcc: "MJPG"         # YUYV no pasa de ~10 FPS a 720p por USB 2.0
    exposure: -1.0         # 100us; ej 100 = 10 ms con luz LED fija. -1 = auto
    wb_temperature: -1.0   # K; ej 4500 con luz fija. -1 = auto
    world_frame_id: "world"              # plato plano de referencia, Z arriba
    camera_link_frame_id: "camera_link"  # cuerpo de la camara (REP-103)
    camera_frame_id: "camera_optical_frame"
    camera_height_m: 0.30                # altura de la camara sobre el plato
    publish_camera_static_tf: true
    plate_frame_id: "plate_link"
    ball_frame_id: "ball_link"
    publish_tf: true
    marker_length_m: 0.03
    # Orden TL, TR, BR, BL (como se ven en la imagen). Posiciones en el
    # frame del plato: X derecha, Y ARRIBA en la imagen, Z hacia la camara
    # (por eso TL tiene y > 0). Tableta EC1: ids [0, 1, 3, 2],
    # posiciones [-0.035, 0.0415, 0.035, 0.0415, 0.035, -0.0415, -0.035, -0.0415].
    corner_marker_ids: [0, 1, 3, 2]
    corner_positions_m: [-0.0347, 0.0425, 0.0347, 0.0425, 0.0347, -0.0425, -0.0347, -0.0425]  # ajustado con datos reales 28-sep (antes 83 mm en Y -> inclinacion fantasma de +-12.5 grados)
    aruco_every_n: 1       # subir a 2-3 si ArUco no cabe en el presupuesto
    pose_hold_max_frames: 10
    hsv_lower: [5, 120, 120]
    hsv_upper: [18, 255, 255]
    min_radius_px: 4.0
    max_radius_px: 200.0
    ball_radius_m: 0.02
    use_roi: true
    roi_margin_px: 30
    aruco_roi_margin_px: 40 # ArUco busca primero cerca del plato anterior
    ball_downscale: 2      # pelota a media resolucion (~4x menos costo)
    max_consecutive_misses: 15
    gate_max_speed: 2.0    # m/s (salida en metros, frame del plato)
    gate_min_jump: 0.02    # m
    debug_image_hz: 0.0    # >0 publica debug_image/compressed a esa tasa
    stats_hz: 2.0
